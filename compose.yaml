services:
  aceplus_mysql:
    image: mysql:8.0
    container_name: aceplus_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - ace_plus_db_data:/var/lib/mysql
    networks:
      - ace_plus_network

  acepluss_phpmyadmin:
    image: phpmyadmin
    container_name: aceplus_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: aceplus_mysql

    ports:
      - "8082:80"
    depends_on:
      - aceplus_mysql
    networks:
      - ace_plus_network

volumes:
  ace_plus_db_data:

networks:
  ace_plus_network:
    driver: bridge